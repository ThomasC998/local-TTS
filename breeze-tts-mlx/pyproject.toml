[project]
name = "breeze-tts-mlx"
version = "0.1.0"
description = "Standalone Apple-Silicon MLX inference for Breeze TTS 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.2",
  "numpy>=2.0,<3",
  "qwen-tts==0.1.1",
  "safetensors>=0.8,<1",
  "soundfile>=0.13,<1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "transformers==4.57.3",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false
default-groups = []
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
